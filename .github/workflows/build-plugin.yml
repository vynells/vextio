name: Build NaturalDisasters plugin
on:
  push:
    paths: ['natural-disasters/**', '.github/workflows/build-plugin.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean package
        working-directory: natural-disasters
      - uses: actions/upload-artifact@v4
        with:
          name: NaturalDisasters-jar
          path: natural-disasters/target/NaturalDisasters-*.jar
