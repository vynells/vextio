# ==========================================================
#  PowerGuard - Teams + Combat Tag
#  Colour codes use '&' (e.g. &a, &l). Hex colours: &#RRGGBB
#  Apply changes live with /pg reload
# ==========================================================

# Players listed here always have full admin access (powerguard.admin), even without op.
admins:
  - Haidak

# ----------------------------------------------------------
#  TEAMS
# ----------------------------------------------------------
teams:
  name-min-length: 3
  name-max-length: 16
  # Regex a team name must match.
  name-pattern: '^[A-Za-z0-9_]+$'
  max-members: 10
  max-warps: 4
  # Seconds before a /team invite expires.
  invite-expire-seconds: 120
  # Default colour for new teams. One of: black, dark_blue, dark_green, dark_aqua, dark_red,
  # dark_purple, gold, gray, dark_gray, blue, green, aqua, red, light_purple, yellow, white
  default-color: aqua
  friendly-fire-default: false
  # Size of the shared team ender chest in rows (1-6). Shrinking it never deletes items:
  # items beyond the new size are kept in the save file and come back if you grow it again.
  echest-rows: 3

  teleport:
    # Warm-up in seconds for /team home and /team warp. 0 = instant.
    warmup-seconds: 3
    cancel-on-move: true
    cancel-on-damage: true
    # How the countdown is shown: TITLE, ACTIONBAR or BOTH
    countdown-display: TITLE

  chat:
    # Quick prefixes that send a single message to team chat (e.g. "@t hello" or "!hello").
    prefixes:
      - '@t '
      - '!'
    format: '&8[&bTeam&8] {color}{rank_symbol}{player}&7: &f{message}'
    # Messages team members send are also shown to online admins with this permission.
    spy-permission: 'powerguard.admin'

  nametags:
    # Show "[TAG] " before names in chat (display name).
    chat: true
    # Show "[TAG] " before names in the tab list.
    tablist: true
    format: '{color}[{team}] '

  # Minimum rank needed for each action: OWNER, OFFICER or MEMBER.
  # (Promote, demote, transfer and disband are always owner-only.)
  rank-permissions:
    invite: OFFICER
    kick: OFFICER
    sethome: OFFICER
    home: MEMBER
    setwarp: OFFICER
    delwarp: OFFICER
    warp: MEMBER
    echest: MEMBER
    rename: OWNER
    friendlyfire: OFFICER
    color: OFFICER

  rank-symbols:
    OWNER: '**'
    OFFICER: '*'
    MEMBER: ''

# ----------------------------------------------------------
#  COMBAT
# ----------------------------------------------------------
combat:
  duration-seconds: 20
  display:
    actionbar: true
    bossbar: true
    bossbar-color: RED        # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    bossbar-style: PROGRESS   # PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20
  # Which damage tags a player. Turn individual sources off here.
  tag-sources:
    melee: true
    projectiles: true        # arrows, tridents, snowballs, thrown potions, fireworks, wind charges...
    explosions: true         # TNT, end crystals, respawn anchors, beds lit by a player
    other: true              # anything else where a player is the damage source (e.g. Powers abilities)
  # Seconds a respawn anchor / bed explosion is attributed to the player who clicked it.
  explosion-attribution-seconds: 3
  # Worlds where combat tagging is disabled.
  disabled-worlds: []

  commands:
    # BLACKLIST = block the commands listed in 'blocked'.
    # WHITELIST = block every command except those in 'allowed'.
    mode: BLACKLIST
    # Command names (no slash). Namespaced forms (minecraft:tp, essentials:home) and every alias of
    # a listed command are blocked automatically. /team is always blocked in combat.
    blocked:
      - tp
      - teleport
      - tpa
      - tpaccept
      - tpyes
      - tpahere
      - tpask
      - tpo
      - tphere
      - tpall
      - tppos
      - tpr
      - tprandom
      - rtp
      - randomtp
      - wild
      - wilderness
      - home
      - homes
      - sethome
      - spawn
      - warp
      - warps
      - back
      - return
      - top
      - jump
      - hub
      - lobby
      - enderchest
      - ec
      - echest
    allowed:
      - msg
      - tell
      - w
      - r
      - reply
      - me
      - list
      - powerguard
      - pg

  logout:
    # Kill players who disconnect while in combat.
    kill: true
    # Also kill on connection timeouts (lag). Kicks are never punished.
    punish-timeouts: true
    broadcast: true

  # Item cooldowns (seconds). Shown with the vanilla item-cooldown overlay. 0 disables one.
  cooldowns:
    # true = cooldowns only apply while in combat. false = always apply.
    only-in-combat: true
    ender-pearl: 4
    trident: 5
    lunge: 4

  restrictions:
    block-elytra: false
    block-chorus-fruit: false

